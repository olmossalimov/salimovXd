<html lang="uz">
<head>

<style>
:root{--bg:#050806;--card:#0b120e;--line:#1b2a22;--green:#10d98a;--deep:#0a7a50;--text:#e8f1ec;--mute:#7f9489;--bd2:#1d4d39;--bd3:#1d6b4b;--g0:#7dffc9;--g1:#5cf0b0;--glow:#0d3a27;--in:#070d0a}
html[data-theme=midnight]{--bg:#04060d;--card:#0a1020;--line:#17233d;--green:#3b9eff;--deep:#1456a8;--text:#e8eefc;--mute:#7f8fb0;--bd2:#1f3f73;--bd3:#2b5fae;--g0:#9fd0ff;--g1:#6db6ff;--glow:#0d2347;--in:#060a15}
html[data-theme=aurora]{--bg:#070412;--card:#100a22;--line:#241a42;--green:#a678ff;--deep:#5b2bb8;--text:#f0eafc;--mute:#9a8cb8;--bd2:#4a3190;--bd3:#6a45c4;--g0:#d9c6ff;--g1:#bf9dff;--glow:#2a1359;--in:#0a0617}
html[data-theme=obsidian]{--bg:#080705;--card:#13110a;--line:#2a2412;--green:#f0c35a;--deep:#9a7418;--text:#f6f0e2;--mute:#a39878;--bd2:#6b5a1f;--bd3:#8f7a2a;--g0:#fff3c4;--g1:#f7d98a;--glow:#3a2f0c;--in:#0c0a05}
html[data-theme=neon]{--bg:#05010a;--card:#0e0618;--line:#2a1240;--green:#ff2fd2;--deep:#a3158a;--text:#fbe9f8;--mute:#a98ab0;--bd2:#6a1f66;--bd3:#9a2b92;--g0:#ffb3f0;--g1:#ff7fe3;--glow:#400a3a;--in:#09030f}
html[data-theme=deepspace]{--bg:#02040a;--card:#070c18;--line:#13203a;--green:#4fd8ff;--deep:#1a7fa3;--text:#e6f4fb;--mute:#7898ab;--bd2:#1c5670;--bd3:#27789a;--g0:#b5ecff;--g1:#82e2ff;--glow:#08233a;--in:#04080f}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,var(--glow) 0,transparent 60%),var(--bg);color:var(--text);font:16px/1.65 Manrope,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:64px 0 40px;text-align:center}
.logo{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font:700 34px 'Playfair Display',serif;color:#04130c;background:linear-gradient(135deg,var(--g0),var(--green) 45%,var(--deep));box-shadow:0 0 0 1px var(--bd2),0 0 50px color-mix(in srgb,var(--green) 25%,transparent)}
h1{font:700 clamp(34px,7vw,52px)/1.1 'Playfair Display',serif;letter-spacing:.3px}
.sub{color:var(--mute);margin:14px auto 28px;max-width:440px}
.btn{display:inline-block;border:0;cursor:pointer;font:600 15px Manrope,sans-serif;padding:12px 26px;border-radius:999px;color:#04130c;background:linear-gradient(135deg,var(--g1),var(--green));text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px color-mix(in srgb,var(--green) 25%,transparent)}
.btn.ghost{background:none;color:var(--green);border:1px solid var(--bd2)}
.btn.sm{padding:8px 18px;font-size:14px}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.stats{display:flex;justify-content:center;gap:34px;margin-top:34px;color:var(--mute);font-size:14px}
.stats b{display:block;color:var(--text);font:600 22px 'Playfair Display',serif}
.sec{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.sec h2{font:600 24px 'Playfair Display',serif}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px}
.post.pin{border-color:var(--bd3);box-shadow:0 0 40px color-mix(in srgb,var(--green) 8%,transparent)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:12px}
.pinned{color:var(--green);font-weight:600}
.post h3{font:600 22px/1.3 'Playfair Display',serif;margin-bottom:10px}
.body{white-space:pre-wrap;word-wrap:break-word}
.body a{color:var(--green)}
.post img.pic{width:100%;border-radius:12px;margin-top:16px;border:1px solid var(--line)}
.bar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px Manrope,sans-serif}
.chip:hover,.chip.on{color:var(--green);border-color:var(--bd3)}
.cm{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.c{padding:10px 0;border-bottom:1px dashed var(--line)}
.c small{color:var(--mute);margin-left:8px}
.c b{color:var(--green)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
input,textarea{width:100%;background:var(--in);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;margin-top:10px}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px;white-space:nowrap}
.admin{background:var(--card);border:1px solid var(--bd3);border-radius:18px;padding:24px;margin-bottom:28px}
.admin h2{font:600 22px 'Playfair Display',serif}
.hide{display:none}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.streak{background:linear-gradient(160deg,color-mix(in srgb,var(--green) 8%,var(--card)),var(--card));border:1px solid var(--bd2);border-radius:18px;padding:24px 20px;margin-bottom:28px;text-align:center}
.streak .sn{font:700 56px/1 'Playfair Display',serif;color:var(--green)}
.streak .sl{color:var(--mute);font-size:14px;margin:6px 0 4px}
.streak .nw{color:var(--green);font-size:14px;font-weight:600;margin-top:8px}
.badges{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
.bd{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute);font:600 14px Manrope,sans-serif;line-height:1.1}
.bd small{display:block;font-size:10px;font-weight:500}
.bd.on{color:#04130c;background:linear-gradient(135deg,var(--g0),var(--green));border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--green) 25%,transparent)}
.btn[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
footer{text-align:center;color:var(--mute);font-size:13px;padding:50px 0 60px}
footer a{color:var(--mute);cursor:pointer;text-decoration:underline}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px 0 0;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--bd2)}
.vb{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.stk{display:inline-block;width:1.35em;height:1.35em;vertical-align:-.3em;margin-right:6px}
.stk svg,.stk video{width:100%;height:100%;display:block}
.ps{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:4px}
.pr{background:var(--card);border:1px solid #6b5a1f;border-radius:18px;padding:22px 20px;margin-bottom:28px;text-align:center}
.pr h2{font:600 22px 'Playfair Display',serif;margin-bottom:4px}
.gold{color:#f0c35a}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:8px 0 14px}
.sc{position:relative;background:var(--in);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font:500 12px Manrope,sans-serif;color:var(--mute)}
.sc .stk{width:46px;height:46px;margin:0 auto 4px;display:block}
.sc.on{border-color:#f0c35a;box-shadow:0 0 18px #f0c35a30;color:var(--text)}
.sc.lk{opacity:.5;cursor:not-allowed}
.sc.lk::after{content:"🔒";position:absolute;top:4px;right:6px;font-size:12px}
.gl{text-align:left;color:var(--mute);font-size:13px;margin-top:12px}
.pv{display:flex;align-items:center;justify-content:center;font-size:19px;margin:10px 0 4px}
.ov{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;padding:20px}
.ovc{background:linear-gradient(160deg,#1c1706,#0b120e);border:1px solid #f0c35a;border-radius:22px;padding:34px 26px;text-align:center;max-width:380px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.ovc h2{font:700 26px 'Playfair Display',serif;margin:14px 0 8px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.ovc{animation:none}}
.wrap{max-width:1080px}
header{padding:36px 0 28px}
.stk{margin-left:6px;margin-right:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.side{position:sticky;top:18px;display:grid;gap:18px}
.side .streak,.side .acct{margin:0}
.tabs{display:none;gap:8px;justify-content:center;margin-bottom:20px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:9px 22px;font:600 14px Manrope,sans-serif;cursor:pointer}
.tabs button.on{color:#04130c;background:linear-gradient(135deg,var(--g1),var(--green));border-color:transparent}
.bd{width:48px;height:48px;font-size:13px}.badges{gap:8px}
.acct{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding-bottom:18px;text-align:center}
.cv{height:70px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc,var(--green)) 55%,#000),color-mix(in srgb,var(--acc,var(--green)) 30%,transparent) 60%,var(--card))}
.ah{margin-top:-36px;padding:0 16px}
.avl{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--card);background:color-mix(in srgb,var(--green) 15%,var(--card));margin:0 auto;display:grid;place-items:center;font:700 28px 'Playfair Display',serif;color:var(--green)}
.an{font:600 20px 'Playfair Display',serif;margin-top:8px}
.pill{display:inline-block;font:600 11px Manrope,sans-serif;letter-spacing:.8px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-top:6px}
.pill.gold{color:#f0c35a;border-color:#6b5a1f}.pill.blue{color:#6db6ff;border-color:#1f4a78}
.bio{color:var(--mute);font-size:14px;margin:12px 16px 0}
.bio textarea{margin-top:0}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 16px 6px}
.st div{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11px;color:var(--mute)}
.st b{display:block;color:var(--text);font:600 20px 'Playfair Display',serif}
.ml{font-size:12px;color:var(--mute)}
.acct .gl,.acct .sg,.acct .sl,.ach{margin-left:16px;margin-right:16px}
.acct .sl{color:var(--mute);font-size:13px;margin-top:10px}
.ach{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ac{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.ac.on{color:var(--green);border-color:var(--bd3)}
.nm{display:block;font-size:30px;line-height:46px;color:var(--mute)}
.bigm .vb{width:34px;height:34px;margin:6px 0}
@media(max-width:899px){.cols{grid-template-columns:minmax(0,1fr)}.tabs{display:flex}.side{position:static}body[data-tab=feed] .side{display:none}body[data-tab=acc] .mainc{display:none}}
.view{display:none}
body[data-v=posts] #v-posts,body[data-v=profile] #v-profile,body[data-v=studio] #v-studio,body[data-v=awards] #v-awards{display:block}
.narrow{max-width:720px;margin:0 auto}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start;max-width:880px;margin:0 auto}
.two .streak,.two .acct{margin:0}
.nav{display:flex;gap:8px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:9px 20px;font:600 14px Manrope,sans-serif;cursor:pointer}
.nav button.on{color:#04130c;background:linear-gradient(135deg,var(--g1),var(--green));border-color:transparent}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd2);border-radius:16px;padding:12px 16px;margin-bottom:22px;font-size:14px;color:var(--mute)}
.strip b{font:700 22px 'Playfair Display',serif;color:var(--green)}
.gb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
.gb .sl{color:var(--mute);margin-bottom:14px}
.fw{position:relative;display:inline-grid;place-items:center;border-radius:50%;padding:4px;isolation:isolate}
.fw.sm{padding:2px}
.fw::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--g);animation:spin 5s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fw::before{animation:none}}
.ah>.fw,.pvl>.fw{display:grid;width:max-content;margin:0 auto}
.stat{color:var(--mute);font-size:14px;margin-top:4px}
.pvc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}
.pvc .avl{margin:0 auto}
.stt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.mini{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--green) 15%,var(--card));display:block}
.sc .fw{margin:4px auto 6px}
.sc .dot{display:block;width:34px;height:34px;border-radius:50%;margin:6px auto 8px}
.sc .sw{display:block;width:100%;height:34px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
.awg{display:grid;gap:12px}
.aw{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.aw.on{border-color:var(--bd3)}
.ai{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute);flex:none;font-size:18px}
.aw.on .ai{color:#04130c;background:linear-gradient(135deg,var(--g0),var(--green));border-color:transparent}
.at{flex:1;min-width:0}.at b{display:block}.at span{color:var(--mute);font-size:13px}
.pb{height:5px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--green)}
@media(max-width:700px){
  body{padding-bottom:84px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:0;justify-content:space-around;flex-wrap:nowrap;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .nav button{flex-direction:column;gap:3px;border:0;border-radius:12px;padding:6px 14px;font-size:11px;background:none}
  .nav button.on{background:none;color:var(--green)}
}
@media(max-width:480px){.row{flex-direction:column}.post{padding:18px}}
</style>

function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,800/im.width),c=document.createElement("canvas");
      c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.65))};im.src=r.result};
    r.readAsDataURL(file);
  });
}

$("yr").textContent=new Date().getFullYear();

if(CONFIG.firebase.apiKey.startsWith("SIZNING")){
  $("feed").innerHTML='<p class="empty">Firebase sozlamalari kiritilmagan. Fayl boshidagi CONFIG qismini to\'ldiring.</p>';
}else{
  const app=initializeApp(CONFIG.firebase);db=getFirestore(app);auth=getAuth(app);
  onAuthStateChanged(auth,async u=>{
    const pw=!!u&&u.providerData.some(x=>x.providerId==="password");
    isAdmin=!!u&&(pw||(!!CONFIG.adminEmail&&u.email===CONFIG.adminEmail));
    $("admin").classList.toggle("hide",!isAdmin);
    if(unsubMe){unsubMe();unsubMe=null}
    me=null;if(!u)applyTheme();render();
    if(!u)return;
    const ref=doc(db,"users",u.uid),name=(pw?CONFIG.name:(u.displayName||"Foydalanuvchi")).slice(0,40);
    try{
      const sn=await getDoc(ref);
      if(!sn.exists())await setDoc(ref,{name,photo:pw?"":(u.photoURL||""),count:0,best:0,day:0,verified:false,premium:false,createdAt:Date.now()});
      else if(sn.data().name!==name)await updateDoc(ref,{name});
    }catch(e){console.error(e)}
    unsubMe=onSnapshot(ref,x=>{me=x.exists()?{uid:u.uid,...x.data()}:null;applyTheme();render()});
  });
  onSnapshot(query(collection(db,"users"),where("verified","==",true)),x=>{vmap=new Map(x.docs.map(d=>[d.id,d.data()]));render()});
  onSnapshot(query(collection(db,"users"),where("premium","==",true)),x=>{pmap=new Map(x.docs.map(d=>[d.id,d.data()]));render()});
  onSnapshot(query(collection(db,"posts"),orderBy("date","desc")),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    err=>{$("feed").innerHTML='<p class="empty">Ma\'lumot yuklanmadi: '+esc(err.message)+'</p>'});
  onSnapshot(query(collection(db,"comments"),orderBy("date","asc")),s=>{comments=s.docs.map(d=>({id:d.id,...d.data()}));render()});
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").classList.remove("hide")});
$("inst").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("inst").classList.add("hide")};
</script>
</body>
</html>
