<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>salimovXd</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050806">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050806;--card:#0b120e;--line:#1b2a22;--green:#10d98a;--deep:#0a7a50;--text:#e8f1ec;--mute:#7f9489}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#0d3a27 0,transparent 60%),var(--bg);color:var(--text);font:16px/1.65 Manrope,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:64px 0 40px;text-align:center}
.logo{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font:700 34px 'Playfair Display',serif;color:#04130c;background:linear-gradient(135deg,#7dffc9,var(--green) 45%,var(--deep));box-shadow:0 0 0 1px #1d4d39,0 0 50px #10d98a40}
h1{font:700 clamp(34px,7vw,52px)/1.1 'Playfair Display',serif;letter-spacing:.3px}
.sub{color:var(--mute);margin:14px auto 28px;max-width:440px}
.btn{display:inline-block;border:0;cursor:pointer;font:600 15px Manrope,sans-serif;padding:12px 26px;border-radius:999px;color:#04130c;background:linear-gradient(135deg,#5cf0b0,var(--green));text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px #10d98a40}
.btn.ghost{background:none;color:var(--green);border:1px solid #1d4d39}
.btn.sm{padding:8px 18px;font-size:14px}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.stats{display:flex;justify-content:center;gap:34px;margin-top:34px;color:var(--mute);font-size:14px}
.stats b{display:block;color:var(--text);font:600 22px 'Playfair Display',serif}
.sec{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.sec h2{font:600 24px 'Playfair Display',serif}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:22px}
.post.pin{border-color:#1d6b4b;box-shadow:0 0 40px #10d98a14}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:12px}
.pinned{color:var(--green);font-weight:600}
.post h3{font:600 22px/1.3 'Playfair Display',serif;margin-bottom:10px}
.body{white-space:pre-wrap;word-wrap:break-word}
.body a{color:var(--green)}
.post img.pic{width:100%;border-radius:12px;margin-top:16px;border:1px solid var(--line)}
.bar{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;cursor:pointer;font:500 13px Manrope,sans-serif}
.chip:hover,.chip.on{color:var(--green);border-color:#1d6b4b}
.cm{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.c{padding:10px 0;border-bottom:1px dashed var(--line)}
.c small{color:var(--mute);margin-left:8px}
.c b{color:var(--green)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
input,textarea{width:100%;background:#070d0a;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;margin-top:10px}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px;white-space:nowrap}
.admin{background:var(--card);border:1px solid #1d6b4b;border-radius:18px;padding:24px;margin-bottom:28px}
.admin h2{font:600 22px 'Playfair Display',serif}
.hide{display:none}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.streak{background:linear-gradient(160deg,#0c1d15,#08110c);border:1px solid #1d4d39;border-radius:18px;padding:24px 20px;margin-bottom:28px;text-align:center}
.streak .sn{font:700 56px/1 'Playfair Display',serif;color:var(--green)}
.streak .sl{color:var(--mute);font-size:14px;margin:6px 0 4px}
.streak .nw{color:var(--green);font-size:14px;font-weight:600;margin-top:8px}
.badges{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
.bd{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--mute);font:600 14px Manrope,sans-serif;line-height:1.1}
.bd small{display:block;font-size:10px;font-weight:500}
.bd.on{color:#04130c;background:linear-gradient(135deg,#7dffc9,var(--green));border-color:transparent;box-shadow:0 0 22px #10d98a40}
.btn[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
footer{text-align:center;color:var(--mute);font-size:13px;padding:50px 0 60px}
footer a{color:var(--mute);cursor:pointer;text-decoration:underline}
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:18px 0 0;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid #1d4d39}
.vb{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:4px}
.stk{display:inline-block;width:1.35em;height:1.35em;vertical-align:-.3em;margin-right:6px}
.stk svg,.stk video{width:100%;height:100%;display:block}
.ps{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:4px}
.pr{background:var(--card);border:1px solid #6b5a1f;border-radius:18px;padding:22px 20px;margin-bottom:28px;text-align:center}
.pr h2{font:600 22px 'Playfair Display',serif;margin-bottom:4px}
.gold{color:#f0c35a}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:8px 0 14px}
.sc{position:relative;background:#070d0a;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font:500 12px Manrope,sans-serif;color:var(--mute)}
.sc .stk{width:46px;height:46px;margin:0 auto 4px;display:block}
.sc.on{border-color:#f0c35a;box-shadow:0 0 18px #f0c35a30;color:var(--text)}
.sc.lk{opacity:.5;cursor:not-allowed}
.sc.lk::after{content:"🔒";position:absolute;top:4px;right:6px;font-size:12px}
.gl{text-align:left;color:var(--mute);font-size:13px;margin-top:12px}
.pv{display:flex;align-items:center;justify-content:center;font-size:19px;margin:10px 0 4px}
.ov{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;padding:20px}
.ovc{background:linear-gradient(160deg,#1c1706,#0b120e);border:1px solid #f0c35a;border-radius:22px;padding:34px 26px;text-align:center;max-width:380px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.ovc h2{font:700 26px 'Playfair Display',serif;margin:14px 0 8px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.ovc{animation:none}}
@media(max-width:480px){.row{flex-direction:column}.post{padding:18px}}
</style>
</head>

<div class="wrap">
<div class="topbar" id="topbar"></div>
<header>
  <div class="logo" id="logo">M</div>
  <h1 id="title"></h1>
  <p class="sub" id="desc"></p>
  <a class="btn" id="join" target="_blank" rel="noopener">Telegram'da obuna bo'lish</a>
  <button class="btn ghost hide" id="inst" style="margin-left:8px">Ilovani o'rnatish</button>
  <div class="stats"><div><b id="nPosts">0</b>post</div><div><b id="nCom">0</b>izoh</div></div>
</header>

<section class="streak" id="streak"></section>

  <h2>Yangi post</h2>
  <input id="pTitle" placeholder="Sarlavha (ixtiyoriy)">
  <textarea id="pText" rows="5" placeholder="Telegram'dagi postingizni shu yerga joylang"></textarea>
  <input type="file" id="pImg" accept="image/*">
  <div class="bar">
    <button class="btn sm" id="pub">Chop etish</button>
    <button class="btn sm ghost" id="out">Chiqish</button>
  </div>
</section>

<main>
  <div class="sec"><h2>Postlar</h2></div>
  <div id="feed"></div>
</main>

</div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmt=t=>new Date(t).toLocaleDateString("uz-UZ",{day:"numeric",month:"long",year:"numeric"});
let isAdmin=false,posts=[],comments=[],db,auth,me=null,verified=new Set(),unsubMe=null,stk=new Map(),prem=new Set(),catalog=[],lots=[];
const VB='<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="Tasdiqlangan"><circle cx="12" cy="12" r="11" fill="#3b9eff"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function render(){
  queueMicrotask(mountStk);renderTop();renderStreak();renderPrem();
  $("nPosts").textContent=posts.length;
  $("nCom").textContent=comments.length;
  const open=new Set([...document.querySelectorAll(".cm:not(.hide)")].map(e=>e.dataset.id));
  const drafts={};document.querySelectorAll("#feed input").forEach(i=>drafts[i.id]=i.value);
  const act=document.activeElement&&document.activeElement.id;
  const list=[...posts].sort((a,b)=>(!!b.pin-!!a.pin)||(b.date-a.date));
  if(!list.length){$("feed").innerHTML='<p class="empty">Hozircha post yo\'q.</p>';return}
  $("feed").innerHTML=list.map(p=>{
    const cs=comments.filter(c=>c.postId===p.id);
    return `<article class="post ${p.pin?"pin":""}">
    <div class="meta"><span>${fmt(p.date)}</span>${p.pin?'<span class="pinned">Mahkamlangan</span>':""}</div>
    ${p.title?`<h3>${esc(p.title)}</h3>`:""}
    <div class="body">${linkify(p.text)}</div>
    ${p.img?`<img class="pic" src="${p.img}" alt="">`:""}
    <div class="bar">
      <button class="chip" data-a="like" data-id="${p.id}">♥ ${p.likes||0}</button>
      <button class="chip" data-a="tog" data-id="${p.id}">Izohlar (${cs.length})</button>
      ${isAdmin?`<button class="chip" data-a="pin" data-id="${p.id}">${p.pin?"Mahkamni olish":"Mahkamlash"}</button><button class="chip" data-a="del" data-id="${p.id}">O'chirish</button>`:""}
    </div>
    <div class="cm ${open.has(p.id)?"":"hide"}" data-id="${p.id}">
      ${cs.length?cs.map(c=>`<div class="c"><b>${nameHtml(c.uid,c.name)}</b><small>${fmt(c.date)}</small><div>${esc(c.text)}</div>${isAdmin?`<button class="chip" style="margin-top:6px" data-a="dc" data-id="${c.id}">O'chirish</button>`:""}</div>`).join(""):'<p class="empty">Hali izoh yo\'q. Birinchi bo\'ling.</p>'}
      ${auth&&auth.currentUser&&me?`<div class="row"><input placeholder="${esc(me.name)} sifatida izoh yozing..." maxlength="500" id="t${p.id}"><button class="btn sm" data-a="send" data-id="${p.id}">Yuborish</button></div>`:`<button class="btn ghost sm" style="margin-top:12px" data-a="login">Izoh yozish uchun Google bilan kiring</button>`}
    </div>
  </article>`}).join("");
  for(const k in drafts){const el=$(k);if(el)el.value=drafts[k]}
  if(act&&$(act))$(act).focus();
}

$("feed").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.dataset.id,a=b.dataset.a,p=posts.find(x=>x.id===id);
  try{
    if(a==="tog"){document.querySelector(`.cm[data-id="${id}"]`).classList.toggle("hide");return}
    if(a==="like"){
      const k="liked"+id;let done=false;try{done=localStorage.getItem(k)}catch(x){}
      if(done)return;try{localStorage.setItem(k,1)}catch(x){}
      await updateDoc(doc(db,"posts",id),{likes:increment(1)});
    }
    if(a==="pin")await updateDoc(doc(db,"posts",id),{pin:!p.pin});
    if(a==="del"){
      if(!confirm("Post o'chirilsinmi?"))return;
      await Promise.all(comments.filter(c=>c.postId===id).map(c=>deleteDoc(doc(db,"comments",c.id))));
      await deleteDoc(doc(db,"posts",id));
    }
    if(a==="dc")await deleteDoc(doc(db,"comments",id));
    if(a==="login")return gin();
    if(a==="send"){
      const t=$("t"+id).value.trim();
      if(!t||!me)return;
      $("t"+id).value="";
      await addDoc(collection(db,"comments"),{postId:id,uid:me.uid,name:me.name,text:t,date:Date.now()});
    }
  }catch(err){alert("Xatolik: "+err.message)}
});

$("adm").onclick=async()=>{
  if(isAdmin)return $("admin").scrollIntoView({behavior:"smooth"});
  const em=prompt("Admin emaili:");if(!em)return;
  const pw=prompt("Parol:");if(!pw)return;
  try{await signInWithEmailAndPassword(auth,em.trim(),pw)}catch(x){alert("Email yoki parol noto'g'ri.")}
};
$("out").onclick=()=>signOut(auth);

function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,800/im.width),c=document.createElement("canvas");
      c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.65))};im.src=r.result};
    r.readAsDataURL(file);
  });
}
$("pub").onclick=async()=>{
  const text=$("pText").value.trim();
  if(!text){$("pText").focus();return}
  const f=$("pImg").files[0],img=f?await shrink(f):"";
  if(img.length>900000){alert("Rasm juda katta. Kichikroq rasm tanlang.");return}
  $("pub").disabled=true;
  try{
    await addDoc(collection(db,"posts"),{title:$("pTitle").value.trim(),text,img,date:Date.now(),pin:false,likes:0});
    $("pTitle").value="";$("pText").value="";$("pImg").value="";
  }catch(err){alert("Chop etilmadi: "+err.message)}
  $("pub").disabled=false;
};

/* ===== Akkaunt va kunlik seriya ===== */
const MS=[[3,"Yangi do'st"],[7,"Haftalik"],[15,"Tasdiq"],[30,"Premium"],[100,"Afsona"]];
const todayN=()=>Math.floor((Date.now()+18e6)/864e5);
const bd=b=>MS.map(m=>`<div class="bd ${b>=m[0]?"on":""}" title="${m[1]}">${m[0]}<small>kun</small></div>`).join("");
let prevSeen=0;try{prevSeen=+localStorage.getItem("sx_seen")||0}catch(e){}
const markSeen=()=>{try{localStorage.setItem("sx_seen",Date.now())}catch(e){}};
addEventListener("pagehide",markSeen);
document.addEventListener("visibilitychange",()=>{if(document.hidden)markSeen()});
async function gin(){
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")alert("Kirib bo'lmadi: "+e.message)}
}
function renderTop(){
  const u=auth&&auth.currentUser;
  $("topbar").innerHTML=u?`${me&&me.photo?`<img class="av" src="${esc(me.photo)}" alt="" referrerpolicy="no-referrer">`:""}<span>${me?stkHtml(me.sticker)+esc(me.name)+(me.verified?VB:"")+(me.premium?PS:""):esc(u.displayName||"")}</span><button class="chip" id="gout">Chiqish</button>`:(auth?'<button class="btn ghost sm" id="gin">Google bilan kirish</button>':"");
}
function renderStreak(){
  const fresh=prevSeen?posts.filter(p=>p.date>prevSeen).length:0;
  const nw=fresh?`<div class="nw">Oxirgi tashrifingizdan beri ${fresh} ta yangi post</div>`:"";
  const u=auth&&auth.currentUser;
  if(!u){$("streak").innerHTML=`<div class="sn">15</div><div class="sl">kun ketma-ket kiring: 15 kunda ${VB} tasdiq belgisi, 30 kunda SALIMOV.XD PREMIUM</div><div class="badges">${bd(0)}</div><button class="btn" id="gin2">Google bilan kirish</button>${nw}`;return}
  if(!me){$("streak").innerHTML='<div class="sl">Yuklanmoqda...</div>';return}
  const td=todayN(),done=me.day===td,alive=done||me.day===td-1,n=alive?me.count:0;
  $("streak").innerHTML=`<div class="sn">${n}</div><div class="sl">kun ketma-ket</div><div class="badges">${bd(me.best)}</div>
  <button class="btn" id="chk" ${done?"disabled":""}>${done?"Bugun belgilandi":(me.count&&!alive?"Qaytadan boshlash":"Bugungi kirishni belgilash")}</button>
  <div class="sl" style="margin-top:12px">${me.verified?`Siz tasdiqlangansiz ${VB}`:(n<15?`Tasdiq belgisigacha ${15-n} kun qoldi.`:(me.premium?"":`Premium'gacha ${Math.max(0,30-n)} kun qoldi.`))} ${done?"Ertaga yana qaytib keling.":""}</div>${nw}`;
}
$("topbar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="gin")gin();if(b.id==="gout")signOut(auth)});
$("streak").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="gin2")return gin();
  if(b.id!=="chk"||!me)return;
  const td=todayN();if(me.day===td)return;
  const count=me.day===td-1?me.count+1:1;
  const wasPrem=!!me.premium;
  try{
    await updateDoc(doc(db,"users",me.uid),{count,best:Math.max(me.best,count),day:td,verified:me.verified||count>=15,premium:wasPrem||count>=30});
    if(!wasPrem&&count>=30)showPrem();
  }catch(x){alert("Belgilab bo'lmadi. Internet va telefon vaqtini tekshiring.")}
});

/* ===== Premium va animatsiyali stikerlar ===== */
const PS='<svg class="ps" viewBox="0 0 24 24" role="img" aria-label="Premium"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.1 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#f0c35a"/></svg>';
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,sdata=new Map();
function sload(f){
  if(!sdata.has(f))sdata.set(f,(async()=>{
    const r=await fetch(f);if(!r.ok)throw new Error("yo'q");
    if(f.endsWith(".tgs"))return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text());
    return r.json();
  })());
  return sdata.get(f);
}
const stkHtml=id=>id&&catalog.some(c=>c.id===id)?`<span class="stk" data-s="${esc(id)}"></span>`:"";
const nameHtml=(uid,name)=>stkHtml(stk.get(uid))+esc(name)+(verified.has(uid)?VB:"")+(prem.has(uid)?PS:"");
function mountStk(){
  lots.forEach(a=>{try{a.destroy()}catch(e){}});lots=[];
  document.querySelectorAll(".stk[data-s]").forEach(el=>{
    const c=catalog.find(x=>x.id===el.dataset.s);if(!c)return;
    if(c.file.endsWith(".webm")){el.innerHTML=`<video src="${esc(c.file)}" muted loop playsinline ${reduce?"":"autoplay"}></video>`;return}
    sload(c.file).then(d=>{
      if(!window.lottie||!el.isConnected)return;
      lots.push(lottie.loadAnimation({container:el,renderer:"svg",loop:true,autoplay:!reduce,animationData:JSON.parse(JSON.stringify(d))}));
    }).catch(()=>{});
  });
}
document.addEventListener("visibilitychange",()=>lots.forEach(a=>{try{document.hidden?a.pause():(!reduce&&a.play())}catch(e){}}));
const sgrid=(sel,lock)=>[...new Set(catalog.map(c=>c.group))].map(g=>`<div class="gl">${esc(g)}</div><div class="sg">${catalog.filter(c=>c.group===g).map(c=>`<div class="sc ${lock?"lk":(sel===c.id?"on":"")}" ${lock?"":`data-sid="${esc(c.id)}"`}><span class="stk" data-s="${esc(c.id)}"></span>${esc(c.name)}</div>`).join("")}</div>`).join("");
function renderPrem(){
  const box=$("prem");
  if(!auth||!auth.currentUser||!me||!catalog.length){box.classList.add("hide");return}
  box.classList.remove("hide");
  if(!me.premium){
    const td=todayN(),n=(me.day===td||me.day===td-1)?me.count:0;
    box.innerHTML=`<h2 class="gold">SALIMOV.XD PREMIUM</h2><div class="sl">30 kun ketma-ket kirsangiz avtomatik ochiladi. Hozir: ${n}/30 kun.</div>${sgrid("",true)}<div class="sl">Premium ochilgach, animatsiyali stikerni username yoningizga qo'ya olasiz.</div>`;
    return;
  }
  box.innerHTML=`<h2 class="gold">SALIMOV.XD PREMIUM ${PS}</h2><div class="sl">Faol. Stikerni tanlang, u username yoningizda harakatlanadi.</div><div class="pv">${stkHtml(me.sticker)}${esc(me.name)}${me.verified?VB:""}${PS}</div>${sgrid(me.sticker,false)}<button class="chip" id="stkoff">Stikerni olib tashlash</button>`;
}
$("prem").addEventListener("click",async e=>{
  if(!me||!me.premium)return;
  const sc=e.target.closest("[data-sid]"),off=e.target.closest("#stkoff");
  if(!sc&&!off)return;
  try{await updateDoc(doc(db,"users",me.uid),{sticker:sc?sc.dataset.sid:""})}
  catch(x){alert("Saqlab bo'lmadi: "+x.message)}
});
function showPrem(){
  const o=document.createElement("div");o.className="ov";
  o.innerHTML=`<div class="ovc">${PS.replace('class="ps"','style="width:72px;height:72px"')}<h2 class="gold">Tabriklaymiz!</h2><div class="sl">30 kun ketma-ket kirdingiz va SALIMOV.XD PREMIUM ochildi. Endi animatsiyali stiker tanlashingiz mumkin.</div><button class="btn" style="margin-top:18px">Ajoyib</button></div>`;
  o.addEventListener("click",ev=>{if(ev.target===o||ev.target.closest("button"))o.remove()});
  document.body.appendChild(o);
}
fetch("stickers/stickers.json").then(r=>r.json()).then(j=>{catalog=j;render()}).catch(()=>{});

document.title=CONFIG.name;
$("title").textContent=CONFIG.name;$("fn").textContent=CONFIG.name;
$("desc").textContent=CONFIG.desc;$("join").href=CONFIG.telegram;
$("logo").textContent=CONFIG.name.trim()[0].toUpperCase();
if(CONFIG.logo){const im=new Image();im.alt="";im.onload=()=>{$("logo").textContent="";$("logo").appendChild(im)};im.src=CONFIG.logo}
$("yr").textContent=new Date().getFullYear();

if(CONFIG.firebase.apiKey.startsWith("SIZNING")){
  $("feed").innerHTML='<p class="empty">Firebase sozlamalari kiritilmagan. Fayl boshidagi CONFIG qismini to\'ldiring.</p>';
}else{
  const app=initializeApp(CONFIG.firebase);db=getFirestore(app);auth=getAuth(app);
  onAuthStateChanged(auth,async u=>{
    isAdmin=!!u&&u.providerData.some(x=>x.providerId==="password");
    $("admin").classList.toggle("hide",!isAdmin);
    if(unsubMe){unsubMe();unsubMe=null}
    me=null;render();
    if(!u)return;
    const ref=doc(db,"users",u.uid),name=(isAdmin?CONFIG.name:(u.displayName||"Foydalanuvchi")).slice(0,40);
    try{
      const sn=await getDoc(ref);
      if(!sn.exists())await setDoc(ref,{name,photo:isAdmin?"":(u.photoURL||""),count:0,best:0,day:0,verified:false,premium:false,createdAt:Date.now()});
      else if(sn.data().name!==name)await updateDoc(ref,{name});
    }catch(e){console.error(e)}
    unsubMe=onSnapshot(ref,x=>{me=x.exists()?{uid:u.uid,...x.data()}:null;render()});
  });
  onSnapshot(query(collection(db,"users"),where("verified","==",true)),x=>{verified=new Set(x.docs.map(d=>d.id));render()});
  onSnapshot(query(collection(db,"users"),where("premium","==",true)),x=>{prem=new Set(x.docs.map(d=>d.id));render()});
  onSnapshot(query(collection(db,"users"),where("sticker","!=","")),x=>{stk=new Map(x.docs.map(d=>[d.id,d.data().sticker]));render()});
  onSnapshot(query(collection(db,"posts"),orderBy("date","desc")),s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    err=>{$("feed").innerHTML='<p class="empty">Ma\'lumot yuklanmadi: '+esc(err.message)+'</p>'});
  onSnapshot(query(collection(db,"comments"),orderBy("date","asc")),s=>{comments=s.docs.map(d=>({id:d.id,...d.data()}));render()});
}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").classList.remove("hide")});
$("inst").onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("inst").classList.add("hide")};
</script>
